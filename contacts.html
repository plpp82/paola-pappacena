<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contatti – Paola Pappacena</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: white; font-family: Arial, sans-serif; padding-top: 60px; padding-bottom: 40px; line-height: 1.6; color: #333; }

        .navbar { position: fixed; top: 0; left: 0; right: 0; background: rgba(255,255,255,0.93); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.08); padding: 0 24px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; height: 60px; }
        .navbar-left { display: flex; align-items: center; gap: 16px; }
        .logo { height: 42px; cursor: pointer; }
        .artist-name { height: 28px; cursor: pointer; }
        .navbar-right { display: flex; align-items: center; gap: 4px; }
        .nav-button { color: #2c3e50; text-decoration: none; font-weight: 500; font-size: 0.88em; padding: 7px 11px; border-radius: 5px; letter-spacing: 0.3px; transition: background 0.25s; }
        .nav-button:hover, .nav-button.active { background: rgba(44,62,80,0.09); }
        .social-links { display: flex; gap: 8px; margin-left: 14px; }
        .social-button { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; overflow: hidden; transition: transform 0.2s, box-shadow 0.2s; flex-shrink: 0; }
        .social-button:hover { transform: scale(1.1); box-shadow: 0 3px 10px rgba(0,0,0,0.22); }
        .social-button img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        .hamburger { display: none; flex-direction: column; cursor: pointer; padding: 5px; gap: 5px; flex-shrink: 0; margin-left: 8px; }
        .hamburger span { width: 24px; height: 2px; background: #2c3e50; border-radius: 1px; transition: all 0.3s; }
        .hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(7px,7px); }
        .hamburger.active span:nth-child(2) { opacity: 0; }
        .hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(7px,-7px); }
        .mobile-menu { display: none; position: fixed; top: 60px; left: 0; right: 0; background: rgba(255,255,255,0.97); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.08); padding: 20px; z-index: 999; }
        .mobile-menu.active { display: block; }
        .mobile-nav-links { display: flex; flex-direction: column; gap: 4px; margin-bottom: 20px; }
        .mobile-nav-links .nav-button { text-align: center; padding: 11px 20px; border-bottom: 1px solid rgba(0,0,0,0.04); font-size: 0.95em; }
        .mobile-social { display: flex; justify-content: center; gap: 16px; padding-top: 16px; border-top: 1px solid rgba(0,0,0,0.05); }

        .sticky-footer-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.93); backdrop-filter: blur(12px); border-top: 1px solid rgba(0,0,0,0.08); height: 40px; display: flex; align-items: center; justify-content: center; gap: 12px; z-index: 900; }
        .sticky-copyright { font-size: 0.78em; color: #555; font-style: italic; letter-spacing: 0.3px; }
        .sticky-footer-bar .social-button { width: 24px; height: 24px; }

        /* Contact content */
        .contact-container {
            max-width: 680px; margin: 0 auto; padding: 70px 24px;
            text-align: center;
        }
        .contact-container h1 { font-size: 2em; color: #2c3e50; font-weight: 400; margin-bottom: 24px; letter-spacing: 0.4px; }
        .contact-container p { font-size: 1.05em; color: #555; margin-bottom: 18px; }
        .email-link {
            display: inline-block; margin-top: 8px; font-weight: 600;
            color: #2c3e50; text-decoration: none; font-size: 1.1em;
            border-bottom: 1px dashed #2c3e50; padding-bottom: 2px;
            transition: color 0.2s, border-color 0.2s;
        }
        .email-link:hover { color: #1a2432; border-color: #1a2432; }

        .contact-social {
            display: flex; justify-content: center; gap: 20px; margin-top: 44px;
        }
        .contact-social-link {
            display: flex; flex-direction: column; align-items: center; gap: 7px;
            text-decoration: none; color: #555; font-size: 0.8em; letter-spacing: 0.5px;
            transition: color 0.2s;
        }
        .contact-social-link:hover { color: #2c3e50; }
        .contact-social-link .social-button { width: 46px; height: 46px; }

        .divider { width: 50px; height: 1px; background: rgba(44,62,80,0.2); margin: 40px auto; }

        .footer { background: #f8f9fa; padding: 28px 20px 50px; text-align: center; border-top: 1px solid rgba(0,0,0,0.08); margin-top: 40px; }
        .footer-copyright { color: #666; font-size: 0.88em; font-style: italic; }

        @media (max-width: 768px) {
            .navbar { padding: 0 15px; display: grid; grid-template-columns: auto 1fr auto; gap: 10px; }
            .logo { height: 35px; } .artist-name { height: 22px; }
            .navbar-right .nav-button, .navbar-right .social-links { display: none; }
            .hamburger { display: flex; }
            .contact-container { padding: 50px 20px; }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="navbar-left">
        <a href="index.html"><img src="https://raw.githubusercontent.com/plpp82/paola-pappacena/main/img/Sigla.png" alt="Logo" class="logo"></a>
        <a href="index.html"><img src="https://raw.githubusercontent.com/plpp82/paola-pappacena/main/img/Sigla_2.png" alt="Paola Pappacena" class="artist-name"></a>
    </div>
    <div class="navbar-right">
        <a href="index.html" class="nav-button">Portfolio</a>
        <a href="shop.html" class="nav-button">Shop</a>
        <a href="workshop.html" class="nav-button">Workshop</a>
        <a href="about.html" class="nav-button">About</a>
        <a href="contacts.html" class="nav-button active">Contacts</a>
        <div class="social-links">
            <a href="https://www.instagram.com/torteincielo/" class="social-button" title="Instagram" target="_blank" rel="noopener">
                <img src="https://raw.githubusercontent.com/plpp82/paola-pappacena/main/img/IG_symbol.jpg" alt="Instagram">
            </a>
            <a href="https://www.facebook.com/torte.incielo" class="social-button" title="Facebook" target="_blank" rel="noopener">
                <img src="https://raw.githubusercontent.com/plpp82/paola-pappacena/main/img/FB_symbol.jpg" alt="Facebook">
            </a>
        </div>
        <div class="hamburger" id="hamburger" onclick="toggleMobileMenu()">
            <span></span><span></span><span></span>
        </div>
    </div>
</nav>

<div class="mobile-menu" id="mobileMenu">
    <div class="mobile-nav-links">
        <a href="index.html" class="nav-button">Portfolio</a>
        <a href="shop.html" class="nav-button">Shop</a>
        <a href="workshop.html" class="nav-button">Workshop</a>
        <a href="about.html" class="nav-button">About</a>
        <a href="contacts.html" class="nav-button active">Contacts</a>
    </div>
    <div class="mobile-social">
        <a href="https://www.instagram.com/torteincielo/" class="social-button" title="Instagram" target="_blank" rel="noopener">
            <img src="https://raw.githubusercontent.com/plpp82/paola-pappacena/main/img/IG_symbol.jpg" alt="Instagram">
        </a>
        <a href="https://www.facebook.com/torte.incielo" class="social-button" title="Facebook" target="_blank" rel="noopener">
            <img src="https://raw.githubusercontent.com/plpp82/paola-pappacena/main/img/FB_symbol.jpg" alt="Facebook">
        </a>
    </div>
</div>

<div class="contact-container">
    <h1>Contattami</h1>
    <p>Se sei interessata/o a illustrazioni, libri, progetti, workshop o collaborazioni, scrivimi:</p>
    <a href="mailto:paola.pappacena@yahoo.it" class="email-link">paola.pappacena@yahoo.it</a>

    <div class="divider"></div>

    <p>Puoi trovarmi anche sui social:</p>
    <div class="contact-social">
        <a href="https://www.instagram.com/torteincielo/" class="contact-social-link" target="_blank" rel="noopener">
            <div class="social-button">
                <img src="https://raw.githubusercontent.com/plpp82/paola-pappacena/main/img/IG_symbol.jpg" alt="Instagram">
            </div>
            Instagram
        </a>
        <a href="https://www.facebook.com/torte.incielo" class="contact-social-link" target="_blank" rel="noopener">
            <div class="social-button">
                <img src="https://raw.githubusercontent.com/plpp82/paola-pappacena/main/img/FB_symbol.jpg" alt="Facebook">
            </div>
            Facebook
        </a>
    </div>
</div>

<footer class="footer">
    <div class="footer-copyright" id="footerCopyright"></div>
</footer>

<div class="sticky-footer-bar">
    <span class="sticky-copyright" id="stickyCopyright"></span>
    <a href="https://www.instagram.com/torteincielo/" class="social-button" title="Instagram" target="_blank" rel="noopener">
        <img src="https://raw.githubusercontent.com/plpp82/paola-pappacena/main/img/IG_symbol.jpg" alt="Instagram">
    </a>
    <a href="https://www.facebook.com/torte.incielo" class="social-button" title="Facebook" target="_blank" rel="noopener">
        <img src="https://raw.githubusercontent.com/plpp82/paola-pappacena/main/img/FB_symbol.jpg" alt="Facebook">
    </a>
</div>

<script>
    const year = new Date().getFullYear();
    const cp = `© Paola Pappacena ${year}`;
    document.getElementById('stickyCopyright').textContent = cp;
    document.getElementById('footerCopyright').textContent = cp;

    function toggleMobileMenu() {
        document.getElementById('mobileMenu').classList.toggle('active');
        document.getElementById('hamburger').classList.toggle('active');
    }
    document.addEventListener('click', e => {
        const mm = document.getElementById('mobileMenu');
        const hb = document.getElementById('hamburger');
        if (!document.querySelector('.navbar').contains(e.target) && !mm.contains(e.target)) {
            mm.classList.remove('active'); hb.classList.remove('active');
        }
    });
</script>
</body>
</html>
