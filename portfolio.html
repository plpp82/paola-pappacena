<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio – Paola Pappacena</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: white; font-family: 'Avenir', 'Avenir Next', 'Nunito Sans', Arial, sans-serif; padding-top: 60px; padding-bottom: 40px; color: #333; }

        .navbar { position: fixed; top: 0; left: 0; right: 0; background: rgba(255,255,255,0.93); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.08); padding: 0 24px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; height: 60px; }
        .navbar-left { display: flex; align-items: center; gap: 16px; }
        .logo { height: 42px; cursor: pointer; }
        .artist-name { height: 28px; cursor: pointer; }
        .navbar-right { display: flex; align-items: center; gap: 4px; }
        .nav-button { color: #2c3e50; text-decoration: none; font-weight: 500; font-size: 0.88em; padding: 7px 11px; border-radius: 5px; letter-spacing: 0.3px; transition: background 0.25s; font-family: inherit; }
        .nav-button:hover, .nav-button.active { background: rgba(44,62,80,0.09); }
        .social-links { display: flex; gap: 8px; margin-left: 14px; }
        .social-button { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; overflow: hidden; transition: transform 0.2s, box-shadow 0.2s; flex-shrink: 0; }
        .social-button:hover { transform: scale(1.1); box-shadow: 0 3px 10px rgba(0,0,0,0.22); }
        .social-button img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        .hamburger { display: none; flex-direction: column; cursor: pointer; padding: 5px; gap: 5px; flex-shrink: 0; margin-left: 8px; }
        .hamburger span { width: 24px; height: 2px; background: #2c3e50; border-radius: 1px; transition: all 0.3s; }
        .hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(7px,7px); }
        .hamburger.active span:nth-child(2) { opacity: 0; }
        .hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(7px,-7px); }
        .mobile-menu { display: none; position: fixed; top: 60px; left: 0; right: 0; background: rgba(255,255,255,0.97); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.08); padding: 20px; z-index: 999; }
        .mobile-menu.active { display: block; }
        .mobile-nav-links { display: flex; flex-direction: column; gap: 4px; margin-bottom: 20px; }
        .mobile-nav-links .nav-button { text-align: center; padding: 11px 20px; border-bottom: 1px solid rgba(0,0,0,0.04); font-size: 0.95em; }
        .mobile-social { display: flex; justify-content: center; gap: 16px; padding-top: 16px; border-top: 1px solid rgba(0,0,0,0.05); }

        .sticky-footer-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.93); backdrop-filter: blur(12px); border-top: 1px solid rgba(0,0,0,0.08); height: 40px; display: flex; align-items: center; justify-content: center; gap: 12px; z-index: 900; }
        .sticky-copyright { font-size: 0.78em; color: #555; font-style: italic; letter-spacing: 0.3px; }
        .sticky-footer-bar .social-button { width: 24px; height: 24px; }

        .back-link { display: inline-flex; align-items: center; gap: 7px; margin: 18px 22px 0; color: #2c3e50; text-decoration: none; font-size: 0.87em; font-weight: 500; opacity: 0.65; transition: opacity 0.2s; font-family: inherit; }
        .back-link:hover { opacity: 1; }
        .back-link svg { width: 15px; height: 15px; }

        .portfolio-page { display: flex; gap: 28px; padding: 16px 22px 40px; max-width: 1400px; margin: 0 auto; align-items: flex-start; }

        .portfolio-description { flex: 0 0 270px; order: 2; position: sticky; top: 78px; }
        .description-box { background: #fdf8f0; padding: 20px 22px; border-radius: 6px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
        .description-title { font-size: 0.98em; font-weight: 700; text-transform: uppercase; color: #2c3e50; margin-bottom: 14px; letter-spacing: 0.5px; line-height: 1.4; }
        .description-body { font-size: 0.92em; line-height: 1.72; color: #444; white-space: pre-wrap; word-break: break-word; }
        .description-body a { color: #2c3e50; font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
        .description-body a:hover { color: #1a2432; }

        .portfolio-gallery { flex: 1; order: 1; }
        .masonry-grid { column-count: 3; column-gap: 7px; }
        .masonry-item { break-inside: avoid; margin-bottom: 7px; cursor: pointer; border-radius: 4px; overflow: hidden; position: relative; box-shadow: 0 3px 14px rgba(0,0,0,0.11), 0 1px 3px rgba(0,0,0,0.07); transition: box-shadow 0.3s; user-select: none; }
        .masonry-item:hover { box-shadow: 0 7px 26px rgba(0,0,0,0.18), 0 2px 6px rgba(0,0,0,0.1); }
        .masonry-item img { width: 100%; height: auto; display: block; transition: transform 0.3s; border-radius: 4px; -webkit-user-drag: none; pointer-events: none; }
        .masonry-item:hover img { transform: scale(1.02); }
        .masonry-item::before { content: '© Paola Pappacena'; position: absolute; bottom: 7px; right: 9px; font-size: 0.58em; color: rgba(255,255,255,0.5); font-style: italic; z-index: 3; pointer-events: none; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }
        .masonry-item::after { content: ''; position: absolute; inset: 0; z-index: 2; cursor: pointer; }
        .masonry-item video { width: 100%; height: auto; display: block; border-radius: 4px; pointer-events: none; }
        .video-badge { position: absolute; top: 8px; left: 8px; z-index: 4; background: rgba(0,0,0,0.55); color: white; font-size: 0.65em; padding: 3px 7px; border-radius: 10px; pointer-events: none; }

        .modal { display: none; position: fixed; z-index: 2000; inset: 0; background: rgba(0,0,0,0.93); }
        .modal-close { position: absolute; top: 14px; right: 22px; color: white; font-size: 36px; font-weight: bold; cursor: pointer; z-index: 2001; line-height: 1; opacity: 0.85; transition: opacity 0.2s; }
        .modal-close:hover { opacity: 1; }
        .modal-inner { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); max-width: 93vw; max-height: 90vh; display: flex; align-items: center; justify-content: center; }
        .modal-inner img { max-width: 100%; max-height: 88vh; border-radius: 6px; display: block; }
        .modal-inner video { max-width: 100%; max-height: 88vh; border-radius: 6px; display: block; }
        .modal-nav { position: absolute; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.8); font-size: 52px; font-weight: 300; cursor: pointer; z-index: 2001; padding: 20px 16px; user-select: none; transition: color 0.2s; }
        .modal-nav:hover { color: white; }
        .modal-prev { left: 6px; }
        .modal-next { right: 6px; }

        .footer { background: #f8f9fa; padding: 28px 20px 50px; text-align: center; border-top: 1px solid rgba(0,0,0,0.08); margin-top: 20px; }
        .footer-copyright { color: #666; font-size: 0.88em; font-style: italic; }

        @media (max-width: 960px) {
            .portfolio-page { flex-direction: column; }
            .portfolio-description { flex: none; width: 100%; order: 1; position: static; }
            .portfolio-gallery { order: 2; width: 100%; }
            .masonry-grid { column-count: 2; }
        }
        @media (max-width: 768px) {
            .navbar { padding: 0 15px; display: grid; grid-template-columns: auto 1fr auto; gap: 10px; }
            .logo { height: 35px; } .artist-name { height: 22px; }
            .navbar-right .nav-button, .navbar-right .social-links { display: none; }
            .hamburger { display: flex; }
            .portfolio-page { padding: 12px 14px 36px; }
        }
        @media (max-width: 480px) {
            .masonry-grid { column-count: 1; }
        }
    </style>
</head>

<script>
// ── Copyright ──
const year = new Date().getFullYear();
const cp = `© Paola Pappacena ${year}`;
document.getElementById('stickyCopyright').textContent = cp;
document.getElementById('footerCopyright').textContent = cp;

const BASE = 'https://raw.githubusercontent.com/plpp82/paola-pappacena/main/img/';

function fi(p, n, ext) { return `Portfolio_${p}.${n}.${ext}`; }
function imgs(p, count, ext) { return Array.from({length: count}, (_, i) => fi(p, i+1, ext)); }

const PORTFOLIOS = {
    1:  { images: imgs(1, 4, 'jpg') },
    2:  { images: imgs(2, 20, 'jpg') },
    3:  { images: [
            fi(3,1,'jpg'), fi(3,2,'jpg'), fi(3,3,'jpeg'),
            fi(3,4,'jpeg'), fi(3,5,'jpeg'), fi(3,6,'jpg')
        ]},
    4:  { images: imgs(4, 3, 'jpg') },
    5:  { images: imgs(5, 5, 'jpg') },
    6:  { images: [
            fi(6,8,'jpg'), fi(6,1,'png'), fi(6,3,'jpg'),
            fi(6,11,'jpg'), fi(6,4,'png'),fi(6,9,'jpg'), 
			fi(6,2,'png'), fi(6,12,'jpg'),fi(6,13,'png'),
			fi(6,5,'jpg'), fi(6,6,'png'), fi(6,7,'jpg')
        ], video: 'Portfolio_6.10.mp4' },
    7:  { images: imgs(7, 8, 'jpg') },
    8:  { images: imgs(8, 5, 'jpg') },
    9:  { images: [fi(9,1,'jpg')] },
    10: { images: imgs(10, 4, 'jpg') },
    11: { images: [
            fi(11,8,'jpg'),  fi(11,9,'jpg'),  fi(11,3,'jpg'),
            fi(11,4,'jpg'),  fi(11,5,'jpg'),  fi(11,6,'jpg'),
            fi(11,7,'jpg'),  fi(11,1,'jpg'),  fi(11,2,'jpg'),
            fi(11,10,'jpg'), fi(11,11,'jpg'), fi(11,12,'jpg'),
            fi(11,13,'jpeg'),fi(11,14,'jpg')
        ]},
    12: { images: imgs(12, 12, 'jpg') },
    13: { images: imgs(13, 9, 'jpg') },
    14: { images: imgs(14, 5, 'jpg') },
    15: { images: imgs(15, 10, 'jpg') },
    16: { images: imgs(16, 5, 'jpg') }
};

let mediaItems = [];
let currentIndex = 0;

const params = new URLSearchParams(window.location.search);
const portfolioId = parseInt(params.get('id') || '1');
document.title = `Portfolio ${portfolioId} – Paola Pappacena`;

// ── Check if we're in "single portfolio" mode or "gallery" mode ──
const isSingle = !!params.get('id');
if (!isSingle) {
    document.querySelector('.back-link').style.display = 'none';
    showGalleryGrid();
} else {
    init();
}

// ── GALLERY GRID (cover thumbnails) ──
function showGalleryGrid() {
    document.title = 'Portfolio – Paola Pappacena';
    const page = document.getElementById('portfolioPage');
    page.style.display = 'block';
    page.style.padding = '0';
    page.style.maxWidth = '100%';

    const container = document.createElement('div');
    container.style.cssText = 'padding: 0; margin: 0;';

    const grid = document.createElement('div');
    grid.style.cssText = 'display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px;';

    // ── Assegnazione manuale delle colonne per bilanciare le altezze ──
    const cols = [[], [], []];
    const colAssign = {
        0: [1, 4, 7, 10, 13],
        1: [2, 5, 8, 11, 14],
        2: [3, 6, 9, 12, 15, 16]
    };
    Object.entries(colAssign).forEach(([col, portIds]) => {
        portIds.forEach(id => { if (PORTFOLIOS[id]) cols[parseInt(col)].push(id); });
    });

    cols.forEach(colIds => {
        const col = document.createElement('div');
        col.style.cssText = 'display: flex; flex-direction: column; gap: 5px;';
        colIds.forEach(id => {
            const item = document.createElement('div');
            item.style.cssText = 'cursor:pointer;overflow:hidden;position:relative;border-radius:3px;box-shadow:0 3px 12px rgba(0,0,0,0.11),0 1px 3px rgba(0,0,0,0.07);transition:box-shadow 0.3s;user-select:none;';
            item.addEventListener('mouseenter', () => { item.style.boxShadow = '0 7px 24px rgba(0,0,0,0.18),0 2px 6px rgba(0,0,0,0.1)'; });
            item.addEventListener('mouseleave', () => { item.style.boxShadow = '0 3px 12px rgba(0,0,0,0.11),0 1px 3px rgba(0,0,0,0.07)'; });
            item.onclick = () => { window.location.href = `portfolio.html?id=${id}`; };

            const wm = document.createElement('span');
            wm.style.cssText = 'position:absolute;bottom:8px;right:10px;font-size:0.6em;color:rgba(255,255,255,0.55);font-style:italic;z-index:3;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,0.5);letter-spacing:0.5px;';
            wm.textContent = '© Paola Pappacena';

            const overlay = document.createElement('span');
            overlay.style.cssText = 'content:"";position:absolute;inset:0;z-index:2;cursor:pointer;';

            const img = document.createElement('img');
            img.src = `${BASE}Portfolio_${id}copertina.jpg`;
            img.alt = `Portfolio ${id}`;
            img.loading = 'lazy';
            img.decoding = 'async';
            img.style.cssText = 'width:100%;height:auto;display:block;transition:transform 0.3s;border-radius:3px;background-color:#f0f0f0;-webkit-user-drag:none;pointer-events:none;';
            item.addEventListener('mouseenter', () => { img.style.transform = 'scale(1.02)'; });
            item.addEventListener('mouseleave', () => { img.style.transform = ''; });
            img.onerror = () => { item.style.display = 'none'; };

            item.appendChild(img);
            item.appendChild(wm);
            item.appendChild(overlay);
            col.appendChild(item);
        });
        grid.appendChild(col);
    });

    container.appendChild(grid);
    page.appendChild(container);

    // Responsive
    function setGridCols() {
        grid.style.gridTemplateColumns = window.innerWidth <= 768 ? '1fr' : 'repeat(3, 1fr)';
    }
    setGridCols();
    window.addEventListener('resize', setGridCols);
}

// ── Load description ──
async function loadDescription(id) {
    try {
        const r = await fetch(BASE + `Portfolio_${id}.txt`);
        if (!r.ok) return null;
        const contentType = r.headers.get('content-type') || '';
        if (contentType.toLowerCase().includes('charset=')) return await r.text();
        const buf = await r.arrayBuffer();
        const utf8 = new TextDecoder('utf-8', { fatal: false }).decode(buf);
        if (!utf8.includes('\uFFFD')) return utf8;
        try { return new TextDecoder('windows-1252').decode(buf); }
        catch { return utf8; }
    } catch { return null; }
}

function parseDescription(raw) {
    if (!raw || !raw.trim()) return { title: '', body: '' };
    const normalized = raw.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    const match = normalized.match(/<<(.+?)>>/s);
    let title = '';
    let body = normalized;
    if (match) {
        title = match[1].trim();
        body = normalized.replace(match[0], '').replace(/^\n+/, '').trimEnd();
    }
    return { title, body };
}

// ── Auto-link URLs in plain text ──
function linkifyText(text) {
    const urlRegex = /(https?:\/\/[^\s]+|www\.[^\s]+)/g;
    const parts = text.split(urlRegex);
    const frag = document.createDocumentFragment();
    parts.forEach((part, i) => {
        if (urlRegex.test(part)) {
            const a = document.createElement('a');
            a.href = part.startsWith('http') ? part : 'https://' + part;
            a.textContent = part;
            a.target = '_blank';
            a.rel = 'noopener';
            frag.appendChild(a);
        } else {
            frag.appendChild(document.createTextNode(part));
        }
        urlRegex.lastIndex = 0;
    });
    return frag;
}

// ── Build single portfolio page ──
async function init() {
    const def = PORTFOLIOS[portfolioId];
    if (!def) return;

    mediaItems = def.images.map(f => ({ src: BASE + f, type: 'image' }));
    if (def.video) mediaItems.push({ src: BASE + def.video, type: 'video' });

    const page = document.getElementById('portfolioPage');

    const galleryDiv = document.createElement('div');
    galleryDiv.className = 'portfolio-gallery';
    const grid = document.createElement('div');
    grid.className = 'masonry-grid';

    mediaItems.forEach((item, idx) => {
        const cell = document.createElement('div');
        cell.className = 'masonry-item';
        cell.addEventListener('click', () => openModal(idx));

        if (item.type === 'video') {
            const badge = document.createElement('span');
            badge.className = 'video-badge';
            badge.textContent = '▶ VIDEO';
            cell.appendChild(badge);
            const vid = document.createElement('video');
            vid.src = item.src;
            vid.muted = true; vid.loop = true; vid.autoplay = true; vid.playsInline = true;
            vid.setAttribute('playsinline', '');
            cell.appendChild(vid);
        } else {
            const img = document.createElement('img');
            img.src = item.src;
            img.alt = `Portfolio ${portfolioId} – ${idx + 1}`;
            img.loading = 'lazy'; img.decoding = 'async';
            img.onerror = () => { cell.style.display = 'none'; };
            cell.appendChild(img);
        }
        grid.appendChild(cell);
    });

    galleryDiv.appendChild(grid);

    const descDiv = document.createElement('div');
    descDiv.className = 'portfolio-description';
    const rawText = await loadDescription(portfolioId);
    const { title, body } = parseDescription(rawText);

    if (title || body) {
        const box = document.createElement('div');
        box.className = 'description-box';
        if (title) {
            const t = document.createElement('div');
            t.className = 'description-title';
            t.textContent = title;
            box.appendChild(t);
        }
        if (body) {
            const b = document.createElement('div');
            b.className = 'description-body';
            const lines = body.split('\n');
            lines.forEach((line, i) => {
                b.appendChild(linkifyText(line));
                if (i < lines.length - 1) b.appendChild(document.createElement('br'));
            });
            box.appendChild(b);
        }
        descDiv.appendChild(box);
    }

    page.appendChild(galleryDiv);
    page.appendChild(descDiv);
}

// ── Modal ──
function openModal(idx) {
    currentIndex = idx;
    renderModal(true);
    document.getElementById('imageModal').style.display = 'block';
}

function renderModal(isFirstOpen) {
    const item = mediaItems[currentIndex];
    const img = document.getElementById('modalImage');
    const vid = document.getElementById('modalVideo');
    if (item.type === 'video') {
        img.style.display = 'none'; img.src = '';
        vid.style.display = 'block'; vid.src = item.src; vid.load();
        if (isFirstOpen) {
            vid.muted = false;
            const p = vid.play();
            if (p !== undefined) p.catch(() => { vid.muted = true; vid.play(); });
        }
    } else {
        vid.pause(); vid.removeAttribute('src'); vid.load(); vid.style.display = 'none';
        img.style.display = 'block'; img.src = item.src;
    }
}

function navigateModal(dir) {
    currentIndex = (currentIndex + dir + mediaItems.length) % mediaItems.length;
    renderModal(false);
}

function closeModal() {
    document.getElementById('imageModal').style.display = 'none';
    const vid = document.getElementById('modalVideo');
    vid.pause(); vid.removeAttribute('src'); vid.load();
}

document.getElementById('imageModal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});

document.addEventListener('keydown', e => {
    const modal = document.getElementById('imageModal');
    if (modal.style.display === 'block') {
        if (e.key === 'Escape') closeModal();
        if (e.key === 'ArrowRight') navigateModal(1);
        if (e.key === 'ArrowLeft') navigateModal(-1);
    }
    if (e.ctrlKey && ['s','u','p','a'].includes(e.key.toLowerCase())) e.preventDefault();
    if (e.key === 'PrintScreen') navigator.clipboard?.writeText('');
});

document.addEventListener('contextmenu', e => { if (e.target.tagName === 'IMG') e.preventDefault(); });
document.addEventListener('dragstart', e => { if (e.target.tagName === 'IMG') e.preventDefault(); });

function toggleMobileMenu() {
    document.getElementById('mobileMenu').classList.toggle('active');
    document.getElementById('hamburger').classList.toggle('active');
}
document.addEventListener('click', e => {
    const mm = document.getElementById('mobileMenu');
    const hb = document.getElementById('hamburger');
    if (!document.querySelector('.navbar').contains(e.target) && !mm.contains(e.target)) {
        mm.classList.remove('active'); hb.classList.remove('active');
    }
});
</script>
</body>
</html>
