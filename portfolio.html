<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio – Paola Pappacena</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: white; font-family: Arial, sans-serif; padding-top: 60px; padding-bottom: 40px; color: #333; }

        /* ── Navbar ── */
        .navbar {
            position: fixed; top: 0; left: 0; right: 0;
            background: rgba(255,255,255,0.93); backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0,0,0,0.08);
            padding: 0 24px; display: flex; justify-content: space-between; align-items: center;
            z-index: 1000; height: 60px;
        }
        .navbar-left { display: flex; align-items: center; gap: 16px; }
        .logo { height: 42px; cursor: pointer; }
        .artist-name { height: 28px; cursor: pointer; }
        .navbar-right { display: flex; align-items: center; gap: 4px; }
        .nav-button { color: #2c3e50; text-decoration: none; font-weight: 500; font-size: 0.88em; padding: 7px 11px; border-radius: 5px; letter-spacing: 0.3px; transition: background 0.25s; }
        .nav-button:hover, .nav-button.active { background: rgba(44,62,80,0.09); }
        .social-links { display: flex; gap: 8px; margin-left: 14px; }
        .social-button { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; overflow: hidden; transition: transform 0.2s, box-shadow 0.2s; flex-shrink: 0; }
        .social-button:hover { transform: scale(1.1); box-shadow: 0 3px 10px rgba(0,0,0,0.22); }
        .social-button img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
        .hamburger { display: none; flex-direction: column; cursor: pointer; padding: 5px; gap: 5px; flex-shrink: 0; margin-left: 8px; }
        .hamburger span { width: 24px; height: 2px; background: #2c3e50; border-radius: 1px; transition: all 0.3s; }
        .hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(7px,7px); }
        .hamburger.active span:nth-child(2) { opacity: 0; }
        .hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(7px,-7px); }
        .mobile-menu { display: none; position: fixed; top: 60px; left: 0; right: 0; background: rgba(255,255,255,0.97); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.08); padding: 20px; z-index: 999; }
        .mobile-menu.active { display: block; }
        .mobile-nav-links { display: flex; flex-direction: column; gap: 4px; margin-bottom: 20px; }
        .mobile-nav-links .nav-button { text-align: center; padding: 11px 20px; border-bottom: 1px solid rgba(0,0,0,0.04); font-size: 0.95em; }
        .mobile-social { display: flex; justify-content: center; gap: 16px; padding-top: 16px; border-top: 1px solid rgba(0,0,0,0.05); }

        /* ── Sticky footer bar ── */
        .sticky-footer-bar {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(255,255,255,0.93); backdrop-filter: blur(12px);
            border-top: 1px solid rgba(0,0,0,0.08);
            height: 40px; display: flex; align-items: center; justify-content: center;
            gap: 12px; z-index: 900;
        }
        .sticky-copyright { font-size: 0.78em; color: #555; font-style: italic; letter-spacing: 0.3px; }
        .sticky-footer-bar .social-button { width: 24px; height: 24px; }

        /* ── Back link ── */
        .back-link {
            display: inline-flex; align-items: center; gap: 7px;
            margin: 18px 22px 0; color: #2c3e50; text-decoration: none;
            font-size: 0.87em; font-weight: 500; opacity: 0.65; transition: opacity 0.2s;
        }
        .back-link:hover { opacity: 1; }
        .back-link svg { width: 15px; height: 15px; }

        /* ── Layout ── */
        .portfolio-page {
            display: flex; gap: 28px; padding: 16px 22px 40px;
            max-width: 1400px; margin: 0 auto; align-items: flex-start;
        }

        /* Description – right column, sticky */
        .portfolio-description { flex: 0 0 270px; order: 2; position: sticky; top: 78px; }
        .description-box {
            background: #fafafa; border-left: 3px solid #2c3e50;
            padding: 20px 22px; border-radius: 0 6px 6px 0;
            box-shadow: 0 2px 12px rgba(0,0,0,0.07);
        }
        .description-title {
            font-size: 0.98em; font-weight: 700; text-transform: uppercase;
            color: #2c3e50; margin-bottom: 14px; letter-spacing: 0.5px;
            line-height: 1.35;
        }
        .description-body {
            font-size: 0.92em; line-height: 1.72; color: #444;
            white-space: pre-wrap; word-break: break-word;
        }

        /* ── Gallery ── */
        .portfolio-gallery { flex: 1; order: 1; }
        .masonry-grid { column-count: 3; column-gap: 7px; }
        .masonry-item {
            break-inside: avoid; margin-bottom: 7px; cursor: pointer;
            border-radius: 4px; overflow: hidden; position: relative;
            box-shadow: 0 3px 14px rgba(0,0,0,0.11), 0 1px 3px rgba(0,0,0,0.07);
            transition: box-shadow 0.3s; user-select: none;
        }
        .masonry-item:hover { box-shadow: 0 7px 26px rgba(0,0,0,0.18), 0 2px 6px rgba(0,0,0,0.1); }
        .masonry-item img {
            width: 100%; height: auto; display: block; transition: transform 0.3s;
            border-radius: 4px; -webkit-user-drag: none; pointer-events: none;
        }
        .masonry-item:hover img { transform: scale(1.02); }
        /* Watermark */
        .masonry-item::before {
            content: '© Paola Pappacena';
            position: absolute; bottom: 7px; right: 9px;
            font-size: 0.58em; color: rgba(255,255,255,0.5);
            font-style: italic; z-index: 3; pointer-events: none;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5); letter-spacing: 0.4px;
        }
        /* Transparent click-capture overlay */
        .masonry-item::after { content: ''; position: absolute; inset: 0; z-index: 2; cursor: pointer; }
        /* Video items */
        .masonry-item video { width: 100%; height: auto; display: block; border-radius: 4px; }
        .video-badge {
            position: absolute; top: 8px; left: 8px; z-index: 4;
            background: rgba(0,0,0,0.55); color: white;
            font-size: 0.65em; padding: 3px 7px; border-radius: 10px;
            letter-spacing: 0.5px; pointer-events: none;
        }

        /* Loading */
        .loading-wrap { padding: 60px 20px; text-align: center; color: #888; font-size: 1em; }
        .loading-spinner {
            width: 36px; height: 36px; border: 3px solid #e0e0e0;
            border-top-color: #2c3e50; border-radius: 50%;
            animation: spin 0.8s linear infinite; margin: 0 auto 14px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Modal ── */
        .modal {
            display: none; position: fixed; z-index: 2000;
            inset: 0; background: rgba(0,0,0,0.93); cursor: pointer;
        }
        .modal-close {
            position: absolute; top: 14px; right: 22px; color: white;
            font-size: 36px; font-weight: bold; cursor: pointer; z-index: 2001;
            line-height: 1; text-shadow: 0 2px 6px rgba(0,0,0,0.4); opacity: 0.85;
            transition: opacity 0.2s;
        }
        .modal-close:hover { opacity: 1; }
        .modal-inner {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
            max-width: 93vw; max-height: 90vh; display: flex; align-items: center; justify-content: center;
        }
        .modal-inner img, .modal-inner video {
            max-width: 100%; max-height: 88vh; border-radius: 6px; display: block;
            pointer-events: auto;
        }
        .modal-nav {
            position: absolute; top: 50%; transform: translateY(-50%);
            color: rgba(255,255,255,0.8); font-size: 52px; font-weight: 300;
            cursor: pointer; z-index: 2001; padding: 20px 16px; user-select: none;
            transition: color 0.2s;
        }
        .modal-nav:hover { color: white; }
        .modal-prev { left: 6px; }
        .modal-next { right: 6px; }

        /* ── Footer ── */
        .footer { background: #f8f9fa; padding: 28px 20px 50px; text-align: center; border-top: 1px solid rgba(0,0,0,0.08); margin-top: 20px; }
        .footer-copyright { color: #666; font-size: 0.88em; font-style: italic; }

        /* ── Responsive ── */
        @media (max-width: 960px) {
            .portfolio-page { flex-direction: column; }
            .portfolio-description { flex: none; width: 100%; order: 1; position: static; }
            .portfolio-gallery { order: 2; width: 100%; }
            .masonry-grid { column-count: 2; }
        }
        @media (max-width: 768px) {
            .navbar { padding: 0 15px; display: grid; grid-template-columns: auto 1fr auto; gap: 10px; }
            .logo { height: 35px; } .artist-name { height: 22px; }
            .navbar-right .nav-button, .navbar-right .social-links { display: none; }
            .hamburger { display: flex; }
            .portfolio-page { padding: 12px 14px 36px; }
        }
        @media (max-width: 480px) {
            .masonry-grid { column-count: 1; }
            .logo { height: 30px; } .artist-name { height: 18px; }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="navbar-left">
        <a href="/"><img src="https://raw.githubusercontent.com/plpp82/paola-pappacena/main/img/Sigla.png" alt="Logo" class="logo"></a>
        <a href="/"><img src="https://raw.githubusercontent.com/plpp82/paola-pappacena/main/img/Sigla_2.png" alt="Paola Pappacena" class="artist-name"></a>
    </div>
    <div class="navbar-right">
        <a href="index.html" class="nav-button active">Portfolio</a>

<div class="mobile-menu" id="mobileMenu">
    <div class="mobile-nav-links">
        <a href="index.html" class="nav-button active">Portfolio</a>
        <a href="shop.html" class="nav-button">Shop</a>
        <a href="workshop.html" class="nav-button">Workshop</a>
        <a href="about.html" class="nav-button">About</a>
        <a href="contacts.html" class="nav-button">Contacts</a>
    </div>
    <div class="mobile-social">
        <a href="https://www.instagram.com/paola.pappacena/" class="social-button" title="Instagram" target="_blank" rel="noopener">
            <img src="https://raw.githubusercontent.com/plpp82/paola-pappacena/main/img/IG_symbol.jpg" alt="Instagram">
        </a>
        <a href="https://www.facebook.com/torte.incielo" class="social-button" title="Facebook" target="_blank" rel="noopener">
            <img src="https://raw.githubusercontent.com/plpp82/paola-pappacena/main/img/FB_symbol.jpg" alt="Facebook">
        </a>

</div>

<a href="index.html" class="back-link">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    Torna al Portfolio

<div class="portfolio-page" id="portfolioPage">
    <div class="loading-wrap">
        <div class="loading-spinner"></div>
        Caricamento in corso…
    </div>
</div>

<!-- Modal -->
<div id="imageModal" class="modal">
    <span class="modal-close" onclick="closeModal()">&times;</span>
    <span class="modal-nav modal-prev" onclick="navigateModal(-1)">&#8249;</span>
    <span class="modal-nav modal-next" onclick="navigateModal(1)">&#8250;</span>
    <div class="modal-inner" id="modalInner" onclick="event.stopPropagation()">
        <img id="modalImage" src="" alt="" style="display:none;">
        <video id="modalVideo" controls style="display:none;"></video>
    </div>
</div>

<footer class="footer">
    <div class="footer-copyright" id="footerCopyright"></div>
</footer>

<div class="sticky-footer-bar">
    <span class="sticky-copyright" id="stickyCopyright"></span>
    <a href="https://www.instagram.com/paola.pappacena/" class="social-button" title="Instagram" target="_blank" rel="noopener">
        <img src="https://raw.githubusercontent.com/plpp82/paola-pappacena/main/img/IG_symbol.jpg" alt="Instagram">
    </a>
    <a href="https://www.facebook.com/torte.incielo" class="social-button" title="Facebook" target="_blank" rel="noopener">
        <img src="https://raw.githubusercontent.com/plpp82/paola-pappacena/main/img/FB_symbol.jpg" alt="Facebook">
    </a>
</div>

<script>
// ── Config ──
const BASE = 'https://raw.githubusercontent.com/plpp82/paola-pappacena/main/img/';
const year = new Date().getFullYear();
const copyrightText = `© Paola Pappacena ${year}`;
document.getElementById('stickyCopyright').textContent = copyrightText;
document.getElementById('footerCopyright').textContent = copyrightText;

// Known video files per portfolio (filename only)
const KNOWN_VIDEOS = {
    6: ['Portfolio_6.12.mp4']
};

// ── Read URL param ──
const params = new URLSearchParams(window.location.search);
const portfolioId = parseInt(params.get('id') || '1');
document.title = `Portfolio ${portfolioId} – Paola Pappacena`;

// ── Media state ──
let mediaItems = [];   // { src, type: 'image'|'video' }
let currentIndex = 0;
let firstVideoPlay = true; // track first autoplay of video in modal

// ── Auto-detect images via HEAD probing ──
// Extensions to try in order for each index
const IMG_EXTS = ['jpg', 'jpeg', 'JPG', 'JPEG'];

async function probeUrl(url) {
    try {
        const r = await fetch(url, { method: 'HEAD', cache: 'no-store' });
        return r.ok;
    } catch { return false; }
}

async function findImage(portfolioNum, imgIndex) {
    for (const ext of IMG_EXTS) {
        const url = `${BASE}Portfolio_${portfolioNum}.${imgIndex}.${ext}`;
        if (await probeUrl(url)) return { src: url, type: 'image' };
    }
    return null;
}

async function detectMedia(portfolioNum) {
    const items = [];
    let idx = 1;
    // Probe images sequentially – stop at first miss (max 50 to be safe)
    while (idx <= 50) {
        const found = await findImage(portfolioNum, idx);
        if (!found) break;
        items.push(found);
        idx++;
    }
    // Add known videos
    const vids = KNOWN_VIDEOS[portfolioNum] || [];
    for (const v of vids) {
        items.push({ src: BASE + v, type: 'video' });
    }
    return items;
}

// ── Load description text ──
async function loadDescription(portfolioNum) {
    try {
        const r = await fetch(BASE + `Portfolio_${portfolioNum}.txt`, { cache: 'no-store' });
        if (!r.ok) return null;
        // Ensure proper UTF-8 decoding
        const buf = await r.arrayBuffer();
        const decoder = new TextDecoder('utf-8');
        return decoder.decode(buf);
    } catch { return null; }
}

// ── Parse description: first line (quoted) = title, rest = body ──
function parseDescription(raw) {
    if (!raw) return { title: '', body: '' };
    const lines = raw.split('\n');
    let title = '';
    let bodyStart = 0;

    // First non-empty line is the title (strip surrounding quotes if present)
    for (let i = 0; i < lines.length; i++) {
        const trimmed = lines[i].trim();
        if (trimmed) {
            title = trimmed.replace(/^["«""]|["»""]$/g, '');
            bodyStart = i + 1;
            break;
        }
    }

    // Rest is body – preserve line breaks and all characters
    const body = lines.slice(bodyStart).join('\n').replace(/^\n+/, '');
    return { title, body };
}

// ── Build page ──
async function init() {
    const [media, rawText] = await Promise.all([
        detectMedia(portfolioId),
        loadDescription(portfolioId)
    ]);

    mediaItems = media;

    const page = document.getElementById('portfolioPage');
    page.innerHTML = '';

    // ── Gallery ──
    const galleryDiv = document.createElement('div');
    galleryDiv.className = 'portfolio-gallery';
    const grid = document.createElement('div');
    grid.className = 'masonry-grid';

    mediaItems.forEach((item, idx) => {
        const cell = document.createElement('div');
        cell.className = 'masonry-item';
        cell.addEventListener('click', () => openModal(idx));

        if (item.type === 'video') {
            const badge = document.createElement('span');
            badge.className = 'video-badge';
            badge.textContent = '▶ VIDEO';
            cell.appendChild(badge);

            const vid = document.createElement('video');
            vid.src = item.src;
            vid.muted = true; vid.loop = true; vid.autoplay = true; vid.playsInline = true;
            vid.setAttribute('playsinline', '');
            vid.style.pointerEvents = 'none';
            cell.appendChild(vid);
        } else {
            const img = document.createElement('img');
            img.src = item.src;
            img.alt = `Portfolio ${portfolioId} – immagine ${idx + 1}`;
            img.loading = 'lazy'; img.decoding = 'async';
            cell.appendChild(img);
        }
        grid.appendChild(cell);
    });

    galleryDiv.appendChild(grid);

    // ── Description ──
    const descDiv = document.createElement('div');
    descDiv.className = 'portfolio-description';

    const { title, body } = parseDescription(rawText);

    if (title || body) {
        const box = document.createElement('div');
        box.className = 'description-box';

        if (title) {
            const h = document.createElement('div');
            h.className = 'description-title';
            h.textContent = title;
            box.appendChild(h);
        }
        if (body) {
            const p = document.createElement('div');
            p.className = 'description-body';
            p.textContent = body; // textContent preserves \n in pre-wrap
            box.appendChild(p);
        }
        descDiv.appendChild(box);
    }

    page.appendChild(galleryDiv);
    page.appendChild(descDiv);
}

// ── Modal ──
function openModal(idx) {
    currentIndex = idx;
    firstVideoPlay = true;
    renderModal();
    document.getElementById('imageModal').style.display = 'block';
}

function renderModal() {
    const item = mediaItems[currentIndex];
    const img = document.getElementById('modalImage');
    const vid = document.getElementById('modalVideo');

    if (item.type === 'video') {
        img.style.display = 'none';
        vid.style.display = 'block';
        vid.src = item.src;
        if (firstVideoPlay) {
            vid.autoplay = true;
            vid.muted = false;
            firstVideoPlay = false;
            vid.play().catch(() => { vid.muted = true; vid.play(); });
        }
    } else {
        vid.pause();
        vid.style.display = 'none';
        img.style.display = 'block';
        img.src = item.src;
    }
}

function navigateModal(dir) {
    currentIndex = (currentIndex + dir + mediaItems.length) % mediaItems.length;
    firstVideoPlay = false; // subsequent video runs require play
    renderModal();
}

function closeModal() {
    document.getElementById('imageModal').style.display = 'none';
    const vid = document.getElementById('modalVideo');
    vid.pause(); vid.src = '';
    firstVideoPlay = true;
}

document.getElementById('imageModal').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
});

// ── Keyboard ──
document.addEventListener('keydown', e => {
    const modal = document.getElementById('imageModal');
    if (modal.style.display === 'block') {
        if (e.key === 'Escape') closeModal();
        if (e.key === 'ArrowRight') navigateModal(1);
        if (e.key === 'ArrowLeft') navigateModal(-1);
    }
    if (e.ctrlKey && ['s','u','p','a'].includes(e.key.toLowerCase())) e.preventDefault();
    if (e.key === 'PrintScreen') navigator.clipboard?.writeText('');
});

// ── Image protection ──
document.addEventListener('contextmenu', e => { if (e.target.tagName === 'IMG') e.preventDefault(); });
document.addEventListener('dragstart', e => { if (e.target.tagName === 'IMG') e.preventDefault(); });

// ── Mobile menu ──
function toggleMobileMenu() {
    document.getElementById('mobileMenu').classList.toggle('active');
    document.getElementById('hamburger').classList.toggle('active');
}
document.addEventListener('click', e => {
    const mm = document.getElementById('mobileMenu');
    const hb = document.getElementById('hamburger');
    if (!document.querySelector('.navbar').contains(e.target) && !mm.contains(e.target)) {
        mm.classList.remove('active'); hb.classList.remove('active');
    }
});

// ── Run ──
init();
</script>
</body>
</html>
